kind = "mobile"
previewPath = "/"
title = "Friction 1.0.0"
version = "1.0.0"
id = "artifacts/friction"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21672

[services.development]
run = "pnpm --filter @workspace/friction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/friction", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/friction", "run", "serve" ]

[services.env]
PORT = "21672"
BASE_PATH = "/"
