      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceCodeRequestBody"
      responses:
        "201":
          description: Created code request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceCodeRequest"
        "400":
          description: Invite code does not match the requested space, or an anonymous-space nickname is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request already exists, user already participates, recruitment is closed or full, or nickname is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /spaces/{id}/code-requests/{requestId}:
    patch:
      operationId: updateSpaceCodeRequest
      tags: [spaces]
      summary: Approve or reject a code request (operator only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpaceCodeRequestBody"
      responses:
        "200":
          description: Updated code request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceCodeRequest"
        "400":
          description: Missing nickname for anonymous space approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request was already handled, user already participates, recruitment is closed or full, or nickname is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /spaces/{id}/letters:
    get:
      operationId: listSpaceLetters
      tags: [spaces]
      summary: List letters for a space
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Letter list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceLetter"
    post:
      operationId: createSpaceLetter
      tags: [spaces]
      summary: Submit a letter to a space
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceLetterBody"
      responses:
        "201":
          description: Created letter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceLetter"

  /spaces/{id}/letters/{letterId}/scheduled-sends:
    get:
      operationId: listSpaceScheduledSends
      tags: [spaces]
      summary: List scheduled sends for a space letter
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: letterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scheduled send list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceScheduledSend"
    post:
      operationId: createSpaceScheduledSend
      tags: [spaces]
      summary: Schedule a send for a space letter
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: letterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpaceScheduledSendBody"
      responses:
        "201":
          description: Created scheduled send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceScheduledSend"

  /spaces/{id}/letters/{letterId}/scheduled-sends/{sendId}:
    patch:
      operationId: updateSpaceScheduledSend
      tags: [spaces]
      summary: Cancel or update a scheduled send
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: letterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sendId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpaceScheduledSendBody"
      responses:
        "200":
          description: Updated scheduled send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceScheduledSend"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /spaces/by-invite-code/{code}:
    get:
      operationId: getSpaceByInviteCode
      tags: [spaces]
      summary: Look up a space by its invite code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Space with creator info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceWithCreatorInfo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /spaces/{id}/join-context:
    get:
      operationId: getSpaceJoinContext
      tags: [spaces]
      summary: Get the authenticated user's join context for a space (participation, invitation, code request)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Join context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceJoinContext"
        "404":
          description: Space not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /space-invitations:
    get:
      operationId: listUserSpaceInvitations
      tags: [spaces]
      summary: List pending space invitations for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation list with space info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpaceInvitationWithSpace"

  # ─── Neighbors ────────────────────────────────────
  /neighbors:
    get:
      operationId: listNeighbors
      tags: [neighbors]
      summary: List neighbors for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Neighbors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NeighborWithUser"

  /neighbors/{id}:
    get:
      operationId: getNeighbor
      tags: [neighbors]
      summary: Get neighbor by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Neighbor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Neighbor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeNeighbor
      tags: [neighbors]
      summary: Remove neighbor relationship
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /neighbor-requests:
    get:
      operationId: listNeighborRequests
      tags: [neighbors]
      summary: List pending neighbor requests for a user (by recipientId or requesterId)
      parameters:
        - name: recipientId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: requesterId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Neighbor requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NeighborRequestWithUser"
    post:
      operationId: createNeighborRequest
      tags: [neighbors]
      summary: Send a neighbor request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNeighborRequestBody"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborRequest"
        "400":
          description: Already neighbors or duplicate request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /neighbor-requests/{id}:
    get:
      operationId: getNeighborRequest
      tags: [neighbors]
      summary: Get neighbor request by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Neighbor request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteNeighborRequest
      tags: [neighbors]
      summary: Delete (cancel) a neighbor request
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /neighbor-requests/{id}/accept:
    post:
      operationId: acceptNeighborRequest
      tags: [neighbors]
      summary: Accept neighbor request (creates Neighbor, deletes request)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Created neighbor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Neighbor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /neighbor-requests/{id}/reject:
    post:
      operationId: rejectNeighborRequest
      tags: [neighbors]
      summary: Reject neighbor request (deletes request)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Rejected
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── SendRecords ──────────────────────────────────
  /send-records:
    get:
      operationId: listSendRecords
      tags: [send-records]
      summary: List send records for a user
      parameters:
        - name: senderId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Send records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SendRecordWithDetails"
    post:
      operationId: sendArticle
      tags: [send-records]
      summary: Send an article to a recipient
      description: "Creates SendRecord + Inbox entry. Auto-assigns 06:00 KST delivery slot (single daily slot). Article must be LETTER status."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendArticleBody"
      responses:
        "201":
          description: Send record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRecordWithDetails"
        "400":
          description: Article not LETTER or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /send-records/{id}:
    get:
      operationId: getSendRecord
      tags: [send-records]
      summary: Get send record by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Send record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRecordWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSendRecord
      tags: [send-records]
      summary: Delete send record
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Thoughts ──────────────────────────────────────
  /thoughts/question-queue:
    get:
      operationId: getThoughtQuestionQueue
      tags: [thoughts]
      summary: Get the authenticated user's ordered preliminary thought question queue
      description: Creates a bounded, source-backed backlog of preliminary questions when useful source thoughts exist. Creation is idempotent across display retries.
      responses:
        "200":
          description: Ordered queue entries and legacy current/next aliases. Any entry can be absent when there is not enough usable source material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThoughtQuestionQueueResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /thoughts/question-queue/refresh:
    post:
      operationId: refreshThoughtQuestionQueue
      tags: [thoughts]
      summary: Move the unanswered current question to the end of the queue
      description: The current thought ID makes retries safe. A request with a stale ID does not move the newly current question.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshThoughtQuestionQueueBody"
      responses:
        "200":
          description: Replaced queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshThoughtQuestionQueueResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /thoughts/{id}/activate:
    post:
      operationId: activateThoughtQuestion
      tags: [thoughts]
      summary: Turn a queued preliminary question into a normal thought
      description: Removes the question from the queue, preserves its source relations, and prepares the next question. Safe to retry after a successful activation.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Activated thought and updated question queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivateThoughtQuestionResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Thought not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The thought is not a queued preliminary question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /thoughts/{id}/similar:
    get:
      operationId: getSimilarThoughts
      tags: [thoughts]
      summary: Get similar thoughts by vector cosine similarity
      description: Returns the authenticated user's own thoughts ordered by cosine similarity to the given thought's dense embedding. Excludes the source thought itself. Returns an empty array if the source thought has no embedding. Each item includes AI-generated r/k/h fields when analysis succeeds; fields are null on failure or when AI is unavailable.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 15
          description: Maximum number of results to return
      responses:
        "200":
          description: Similar thoughts list ordered by cosine similarity descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SimilarThought"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Thought not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /thoughts:
    get:
      operationId: listThoughts
      tags: [thoughts]
      summary: List thoughts for the authenticated user
      description: Returns thoughts belonging to the authenticated user. Identity is taken from the auth token. Optionally filtered by sourceArticleId.
      parameters:
        - name: sourceArticleId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter thoughts linked to a specific article
      responses:
        "200":
          description: Thought list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Thought"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createThought
      tags: [thoughts]
      summary: Create a thought (단상)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThoughtBody"
      responses:
        "201":
          description: Created thought
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thought"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /thoughts/{id}:
    get:
      operationId: getThought
      tags: [thoughts]
      summary: Get a thought by ID
      description: Returns the authenticated user's own thought by ID. Uses the same shape as the list endpoint.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Thought
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thought"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — thought does not belong to this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Thought not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateThought
      tags: [thoughts]
      summary: Update a thought's content
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThoughtBody"
      responses:
        "200":
          description: Updated thought
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thought"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — thought does not belong to this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Thought not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteThought
      tags: [thoughts]
      summary: Soft-delete a thought
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden — thought does not belong to this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Thought not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /thoughts/{id}/promote:
    post:
      operationId: promoteThought
      tags: [thoughts]
      summary: Promote a Markdown thought to the DIVIDING article stage
      description: "Atomically validates the thought's first H1 title, creates a DIVIDING article, and records the promotion. A thought can only be promoted once and a DIVIDING article cannot be moved back to a thought."
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: Newly created DIVIDING article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Markdown title/body validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — thought does not belong to this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Thought not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Thought was already promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /thoughts/expand:
    post:
      operationId: expandThoughts
      tags: [thoughts]
      summary: Analyze AI connections between a target thought and candidate thoughts
      description: "Given a target thought (단상) and a list of candidate thoughts, returns AI-generated connection analysis for each candidate: connection reason (r), mediating keywords (k), and highlight phrases (h). Uses OpenRouter Gemini Flash 1.5 with a fixed system prompt to enable automatic context caching."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpandThoughtsBody"
      responses:
        "200":
          description: Thought expansion analysis results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpandThoughtsResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: AI service error or OPENROUTER_API_KEY not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Diagnostics ──────────────────────────────────
  /client-logs:
    post:
      operationId: reportClientLog
      tags: [diagnostics]
      summary: Report a client-side diagnostic event
      description: >
        Best-effort, unauthenticated endpoint for the mobile app to report diagnostic
        events (currently: fatal JS errors captured just before an app crash) that were
        persisted on-device and are uploaded on the next launch. No auth is required
        because a crash can happen before the user is signed in. Never rejects on bad
        input; always returns 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientLogBody"
      responses:
        "204":
          description: Logged

  # ─── Push Tokens ──────────────────────────────────
  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [push-tokens]
      summary: Register an Expo push token
      description: Upserts an Expo push token for the authenticated user. Safe to call on every app launch.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenBody"
      responses:
        "204":
          description: Token registered
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable machine-readable error code when the client needs an actionable recovery path. Codes are endpoint-specific; omitted for generic errors.
      required:
        - error

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── User ───────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        nickname:
          type: string
        avatarUrl:
          type: string
          nullable: true
        recentSavedCollectionId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
