    # ─── Article ────────────────────────────────────
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        authorNickname:
          type: string
          nullable: true
          description: Author's nickname. Populated by listArticles when joining users; may be null on other endpoints.
        collectionName:
          type: string
          nullable: true
          description: Name of the collection this article belongs to (team collection preferred, personal collection fallback). Populated by getArticle; may be null on other endpoints.
        collectionId:
          type: string
          format: uuid
          nullable: true
          description: ID of the team collection this article was delivered through, used for navigation to the collection detail. Null for personal-only or 1:1 articles. Populated by getArticle; may be null on other endpoints.
        title:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [DIVIDING, CLOSING, LETTER]
        pages:
          type: array
          items:
            type: string
          nullable: true
        layoutWidth:
          type: number
          nullable: true
          description: Container width used when splitting pages (px). Used to ensure consistent line-break rendering across preview and reader screens.
        style:
          type: object
          nullable: true
        cover:
          $ref: "#/components/schemas/ArticleCover"
          nullable: true
        letterAt:
          type: string
          format: date-time
          nullable: true
        sourceArticleId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, authorId, title, content, status, createdAt, updatedAt]

    UpdateArticleBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        pages:
          type: array
          items:
            type: string
          nullable: true
        layoutWidth:
          type: number
          nullable: true
          description: Container width used when splitting pages (px).
        style:
          type: object
          nullable: true
        cover:
          $ref: "#/components/schemas/ArticleCover"
          nullable: true
        sourceArticleId:
          type: string
          format: uuid
          nullable: true
          description: ID of the source article this draft is a reply to. Set to null to unlink.

    ArticleCover:
      type: object
      description: Article cover display settings. null means default cover.
      properties:
        type:
          type: string
          enum: [image, color, default]
        imageUrl:
          type: string
          format: uri
          description: Cover image URL (used when type=image)
        bgColor:
          type: string
          description: Background color hex (used when type=color)
        textColor:
          type: string
          description: Text color hex for title overlay
        fontFamily:
          type: string
          enum: [sans, serif]
          default: sans
          description: Cover text font family. Existing covers without this value use sans.
        align:
          type: string
          enum: [left, center]
      required: [type, textColor, align]

    TransitionArticleBody:
      type: object
      properties:
        targetStatus:
          type: string
          enum: [DIVIDING, CLOSING, LETTER]
      required: [targetStatus]

    FinalizeArticleBody:
      type: object
      properties:
        myCollectionId:
          type: string
          format: uuid
          description: Optional personal collection to add the finalized article to. When omitted, the article is finalized without being added to a collection.

    ArticleQuestionsResponse:
      type: object
      properties:
        questions:
          type: array
          items:
            type: string
          description: Ordered list of question card questions. 5 AI-generated questions when available, otherwise the 3 fixed fallback questions.
      required: [questions]

    # ─── Inbox ──────────────────────────────────────
    InboxItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        sourceTeamCollectionId:
          type: string
          format: uuid
          nullable: true
          description: Team collection through which this inbox row was delivered. NULL for 1:1 / neighbor sends.
        sourceSpaceId:
          type: string
          format: uuid
          nullable: true
          description: Space through which this inbox row was delivered. NULL for team-collection and 1:1 / neighbor sends.
        visibleAt:
          type: string
          format: date-time
        openedAt:
          type: string
          format: date-time
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        article:
          $ref: "#/components/schemas/Article"
        sender:
          $ref: "#/components/schemas/User"
        senderDisplayName:
          type: string
          description: "Safe sender name for inbox display. Anonymous recruiting spaces return 참여자; active/archived spaces return the space nickname or 참여자 when unavailable."
        collectionName:
          type: string
          nullable: true
        isReplyToMe:
          type: boolean
        replyToArticleId:
          type: string
          format: uuid
          nullable: true
        hasReadBefore:
          type: boolean
        hasReadSourceArticle:
          type: boolean
          nullable: true
          description: Whether the recipient has previously completed reading the source (parent) article. NULL when this item is not a reply (replyToArticleId is null).
        isEnvelope:
          type: boolean
          description: Whether this inbox item was sent as a sealed envelope. When true and openedAt is null, the recipient sees the envelope front face first.
