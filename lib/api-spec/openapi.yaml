openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Friction MVP 1.0.0 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User operations
  - name: articles
    description: Article (memo/letter) operations
  - name: inbox
    description: Inbox operations
  - name: my-collections
    description: Personal collection operations
  - name: stored-sentences
    description: Stored sentence operations
  - name: reading
    description: Reading record and progress operations
  - name: team-collections
    description: Team collection operations
  - name: spaces
    description: Space operations
  - name: neighbors
    description: Neighbor relationship operations
  - name: send-records
    description: Send record operations
  - name: spell-check
    description: Korean spell-check operations
  - name: thoughts
    description: Thought (단상) operations
  - name: push-tokens
    description: Expo push token registration
  - name: diagnostics
    description: Client-side diagnostics and crash reporting

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /storage/inline-images:
    post:
      operationId: uploadInlineImage
      tags: [articles]
      summary: Upload a verified inline article image
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Stable public original image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadInlineImageResponse"
        "400":
          description: Invalid image bytes
        "401":
          description: Authentication required

  # ─── Users ────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/recent-collection:
    get:
      operationId: getUserRecentCollection
      tags: [users]
      summary: Get user's recent saved collection ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Recent saved collection info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentSavedCollectionResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUserRecentCollection
      tags: [users]
      summary: Update user's recent saved collection ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecentCollectionBody"
      responses:
        "200":
          description: Updated recent saved collection info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentSavedCollectionResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Articles ─────────────────────────────────────
  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List articles
      parameters:
        - name: authorId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [DIVIDING, CLOSING, LETTER]
        - name: titleQuery
          in: query
          schema:
            type: string
          description: Filter articles by title keyword (case-insensitive substring match)
      responses:
        "200":
          description: Article list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get article by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateArticle
      tags: [articles]
      summary: Update article content/title
      description: Only allowed when status is not LETTER
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateArticleBody"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Validation error or LETTER immutability violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteArticle
      tags: [articles]
      summary: Delete article
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{id}/transition:
    post:
      operationId: transitionArticleStatus
      tags: [articles]
      summary: Transition article status
      description: "Forward: DIVIDING→CLOSING→LETTER. Back: CLOSING→DIVIDING. LETTER transition sets letter_at and makes article immutable."
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionArticleBody"
      responses:
        "200":
          description: Transitioned article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{id}/finalize:
    post:
      operationId: finalizeArticle
      tags: [articles]
      summary: Finalize article (transition to LETTER and add to a personal collection)
      description: "Atomically transitions a CLOSING article to LETTER and adds it to the given personal collection. Idempotent on the LETTER transition: if the article is already LETTER, only the collection link is created. Replaces the previous two-step (transition + add-to-collection) flow with a single round trip."
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeArticleBody"
      responses:
        "200":
          description: Finalized article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Invalid transition or already in collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Article or collection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{id}/questions:
    get:
      operationId: getArticleQuestions
      tags: [articles]
      summary: Get question card questions for an article
      description: "Returns the AI-generated question set for this article's question cards (5 questions, generated in the background when the article was finalized). Falls back to a fixed set of 3 generic questions if generation is still pending, failed, or was never triggered (e.g. articles finalized before this feature)."
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Question list (AI-generated or fallback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleQuestionsResponse"
        "404":
          description: Article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Spell Check ─────────────────────────────────
  /spell-check:
    post:
      operationId: spellCheck
      tags: [spell-check]
      summary: Check Korean spelling and spacing
      description: LLM-based Korean spell/spacing check. Returns a list of suggested corrections.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpellCheckBody"
      responses:
        "200":
          description: Spell check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpellCheckResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: LLM error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Inbox ────────────────────────────────────────
  /inbox:
    get:
      operationId: listInbox
      tags: [inbox]
      summary: List inbox items for a user
      description: Only returns items where visible_at <= now
      parameters:
        - name: recipientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: titleQuery
          in: query
          schema:
            type: string
          description: Filter inbox items by article title keyword (case-insensitive substring match)
      responses:
        "200":
          description: Inbox items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxItem"

  /inbox/{id}:
    get:
      operationId: getInboxItem
      tags: [inbox]
      summary: Get inbox item
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInboxItem
      tags: [inbox]
      summary: Delete inbox item
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inbox/{id}/open:
    post:
      operationId: markInboxOpened
      tags: [inbox]
      summary: Mark inbox item as opened (sets opened_at)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Updated inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inbox/{id}/read:
    post:
      operationId: markInboxRead
      tags: [inbox]
      summary: Mark inbox item as read (完독)
      description: Sets is_read=true and creates UserArticleRead record
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Updated inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inbox/article/{articleId}/read-others:
    post:
      operationId: markInboxOthersRead
      tags: [inbox]
      summary: Bulk-mark all other unread inbox copies of the same article as read
      description: |
        Marks every is_read=false inbox row for the given (recipientId, articleId)
        as read, optionally excluding one inbox row by id. Used after a user
        finishes reading one delivery of an article that arrived through multiple
        team collections, to clear the duplicates without archiving them.
      parameters:
        - name: articleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: recipientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: exceptInboxId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Number of inbox rows updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkInboxOthersReadResponse"

  # ─── MyCollections ────────────────────────────────
  /my-collections:
    get:
      operationId: listMyCollections
      tags: [my-collections]
      summary: List personal collections for a user
      parameters:
        - name: ownerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: articleId
          in: query
          required: false
          description: When provided, each collection includes whether it contains this article.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyCollection"
    post:
      operationId: createMyCollection
      tags: [my-collections]
      summary: Create a personal collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMyCollectionBody"
      responses:
        "201":
          description: Created collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCollection"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /my-collections/{id}:
    get:
      operationId: getMyCollection
      tags: [my-collections]
      summary: Get personal collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCollection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMyCollection
      tags: [my-collections]
      summary: Update personal collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyCollectionBody"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCollection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMyCollection
      tags: [my-collections]
      summary: Delete personal collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /my-collections/{id}/articles:
    get:
      operationId: listMyCollectionArticles
      tags: [my-collections]
      summary: List articles in a personal collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Articles in collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyCollectionArticleWithDetails"
    post:
      operationId: addArticleToMyCollection
      tags: [my-collections]
      summary: Add article to personal collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddArticleBody"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCollectionArticle"
        "400":
          description: Duplicate or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /my-collections/{collectionId}/articles/{articleId}:
    delete:
      operationId: removeArticleFromMyCollection
      tags: [my-collections]
      summary: Remove article from personal collection
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: articleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── StoredSentences ──────────────────────────────
  /stored-sentences:
    get:
      operationId: listStoredSentences
      tags: [stored-sentences]
      summary: List stored sentences for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: favorite
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Sentences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoredSentence"
    post:
      operationId: createStoredSentence
      tags: [stored-sentences]
      summary: Store a sentence from an article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoredSentenceBody"
      responses:
        "201":
          description: Created sentence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSentence"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stored-sentences/{id}:
    get:
      operationId: getStoredSentence
      tags: [stored-sentences]
      summary: Get a stored sentence by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Sentence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSentence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStoredSentence
      tags: [stored-sentences]
      summary: Delete a stored sentence
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stored-sentences/{id}/favorite:
    patch:
      operationId: toggleStoredSentenceFavorite
      tags: [stored-sentences]
      summary: Toggle favorite status
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isFavorite:
                  type: boolean
              required:
                - isFavorite
      responses:
        "200":
          description: Updated sentence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSentence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Reading ──────────────────────────────────────
  /reading-records:
    get:
      operationId: getReadingRecord
      tags: [reading]
      summary: Get reading progress for a user+article
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: articleId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reading record (or null if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingRecordNullable"
    put:
      operationId: upsertReadingRecord
      tags: [reading]
      summary: Create or update reading progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertReadingRecordBody"
      responses:
        "200":
          description: Upserted reading record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reading-records/{id}:
    delete:
      operationId: deleteReadingRecord
      tags: [reading]
      summary: Delete a reading record
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user-article-reads:
    post:
      operationId: createUserArticleRead
      tags: [reading]
      summary: Record article completion (完독)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserArticleReadBody"
      responses:
        "201":
          description: Created read record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserArticleRead"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user-article-reads/{id}:
    get:
      operationId: getUserArticleRead
      tags: [reading]
      summary: Get a user article read record by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Read record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserArticleRead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUserArticleRead
      tags: [reading]
      summary: Delete a user article read record
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user-article-reads/check:
    get:
      operationId: checkArticleRead
      tags: [reading]
      summary: Check if user has completed reading an article
      parameters:
        - name: userId
          in: query
