    RefreshThoughtQuestionQueueResponse:
      allOf:
        - $ref: "#/components/schemas/ThoughtQuestionQueueResponse"
        - type: object
          properties:
            requeued:
              type: boolean
          required: [requeued]

    ActivateThoughtQuestionResponse:
      allOf:
        - $ref: "#/components/schemas/ThoughtQuestionQueueResponse"
        - type: object
          properties:
            activatedThought:
              $ref: "#/components/schemas/Thought"
          required: [activatedThought]

    SimilarThought:
      allOf:
        - $ref: "#/components/schemas/Thought"
        - type: object
          properties:
            r:
              type: string
              nullable: true
              description: 연결 이유 — AI가 생성한 추천 사유 문장 (null if AI failed or no connection)
            k:
              type: array
              items:
                type: string
              nullable: true
              description: 매개 키워드 — 기준 단상에서 강조할 키워드 배열 (null if AI failed)
            h:
              type: array
              items:
                type: string
              nullable: true
              description: 하이라이트 어구 — 추천 단상에서 강조할 키워드 배열 (null if AI failed)

    ThoughtCreatedFrom:
      type: string
      enum: [quoted, question, reading, direct]

    ThoughtStatus:
      type: string
      enum: [NORMAL, PRELIMINARY]

    Thought:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        content:
          type: string
        createdFrom:
          $ref: "#/components/schemas/ThoughtCreatedFrom"
        sourceArticleId:
          type: string
          format: uuid
          nullable: true
        sourceStoredSentenceId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: "#/components/schemas/ThoughtStatus"
        migratedFromArticleId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, authorId, content, createdFrom, status, createdAt, updatedAt]

    ThoughtNote:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
      required: [id, content]

    ThoughtExpansionResult:
      type: object
      properties:
        id:
          type: string
        r:
          type: string
          description: 연결 이유 (connection reason)
        k:
          type: array
          items:
            type: string
          description: 매개 키워드 (mediating keywords)
        h:
          type: array
          items:
            type: string
          description: 하이라이트 어구 (highlight phrases from candidate)
      required: [id, r, k, h]

    ExpandThoughtsBody:
      type: object
      properties:
        targetNote:
          $ref: "#/components/schemas/ThoughtNote"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ThoughtNote"
          minItems: 1
      required: [targetNote, candidates]

    ExpandThoughtsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ThoughtExpansionResult"
      required: [results]

    # ─── SpellCheck ─────────────────────────────────
    SpellCheckBody:
      type: object
      properties:
        text:
          type: string
          description: Markdown text to check
      required: [text]

    SpellChange:
      type: object
      properties:
        context:
          type: string
          description: Surrounding sentence context (≤30 chars)
        original:
          type: string
          description: The erroneous substring
        replacement:
          type: string
          description: The corrected substring
        type:
          type: string
          enum: [맞춤법, 띄어쓰기]
        reason:
          type: string
          description: One-line explanation (≤30 chars)
      required: [context, original, replacement, type, reason]

    SpellCheckResponse:
      type: object
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SpellChange"
        error:
          type: string
          nullable: true
      required: []

    UpdateThoughtBody:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          description: Must include visible text or a non-empty Markdown image; whitespace and Markdown formatting alone are rejected.
      required: [content]

    CreateThoughtBody:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
          description: Optional client-generated ID used to make retried creates idempotent.
        content:
          type: string
          minLength: 1
          description: Must include visible text or a non-empty Markdown image; whitespace and Markdown formatting alone are rejected.
        createdFrom:
          $ref: "#/components/schemas/ThoughtCreatedFrom"
        sourceArticleId:
          type: string
          format: uuid
          nullable: true
        sourceStoredSentenceId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: "#/components/schemas/ThoughtStatus"
      required: [content, createdFrom]

    # ─── PushToken ──────────────────────────────────
    RegisterPushTokenBody:
      type: object
      properties:
        token:
          type: string
          description: Expo push token (ExponentPushToken[...])
        platform:
          type: string
          enum: [ios, android]
        deviceId:
          type: string
          nullable: true
          description: Optional device identifier for de-duplication
      required: [token, platform]

    ClientLogBody:
      type: object
      description: >
        A diagnostic event captured on-device. Release diagnostics deliberately contain
        only a deployment track, host names, short configuration fingerprint, outcome,
        and error class; they never contain emails, access tokens, response bodies, or
        raw exception messages.
      properties:
        source:
          type: string
          description: Where this log came from, e.g. "fatal-js-error"
        message:
          type: string
        name:
          type: string
          nullable: true
        stack:
          type: string
          nullable: true
        isFatal:
          type: boolean
          nullable: true
        timestamp:
          type: string
          nullable: true
          description: ISO timestamp captured on-device
        platform:
          type: string
          nullable: true
        platformVersion:
          type: string
          nullable: true
        appVersion:
          type: string
          nullable: true
        buildNumber:
          type: string
          nullable: true
        release:
          $ref: "#/components/schemas/ReleaseDiagnosticContext"
      required: [source, message]

    ReleaseDiagnosticContext:
      type: object
      additionalProperties: false
      description: >
        Safe build identity included with native release diagnostics. Host names and
        short fingerprints identify the deployed target without exposing configuration
        values or credentials.
      properties:
        track:
          type: string
          enum: [development, preview, production]
        configurationState:
          type: string
          enum: [valid, invalid, unavailable]
        configurationFingerprint:
          type: string
          nullable: true
          pattern: "^[a-f0-9]{16}$"
        supabaseHost:
          type: string
          nullable: true
          maxLength: 253
        apiHost:
          type: string
          nullable: true
          maxLength: 253
      required: [track, configurationState]
