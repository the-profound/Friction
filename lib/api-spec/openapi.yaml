openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Friction MVP 1.0.0 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User operations
  - name: articles
    description: Article (memo/letter) operations
  - name: inbox
    description: Inbox operations
  - name: my-collections
    description: Personal collection operations
  - name: stored-sentences
    description: Stored sentence operations
  - name: reading
    description: Reading record and progress operations
  - name: team-collections
    description: Team collection operations
  - name: neighbors
    description: Neighbor relationship operations
  - name: send-records
    description: Send record operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Users ────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}/recent-collection:
    get:
      operationId: getUserRecentCollection
      tags: [users]
      summary: Get user's recent saved collection ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Recent saved collection info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentSavedCollectionResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUserRecentCollection
      tags: [users]
      summary: Update user's recent saved collection ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecentCollectionBody"
      responses:
        "200":
          description: Updated recent saved collection info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentSavedCollectionResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Articles ─────────────────────────────────────
  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List articles
      parameters:
        - name: authorId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, DIVIDING, CLOSING, LETTER]
      responses:
        "200":
          description: Article list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
    post:
      operationId: createArticle
      tags: [articles]
      summary: Create a new article (DRAFT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArticleBody"
      responses:
        "201":
          description: Created article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/reading-memo:
    get:
      operationId: getOrCreateReadingMemo
      tags: [articles]
      summary: Get or create a ReadingMemo for a source article
      description: "Returns the unique memo article for the given user and source article (1글1메모 원칙). Creates a new DRAFT memo if none exists; if a memo already exists, returns it regardless of its current status. Note: this GET is intentionally side-effecting (creates a row on first access). Avoid caching via intermediary proxies."
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: sourceArticleId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: ReadingMemo article (existing or newly created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source article not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get article by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateArticle
      tags: [articles]
      summary: Update article content/title
      description: Only allowed when status is not LETTER
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateArticleBody"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Validation error or LETTER immutability violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteArticle
      tags: [articles]
      summary: Delete article
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{id}/transition:
    post:
      operationId: transitionArticleStatus
      tags: [articles]
      summary: Transition article status
      description: "Forward only: DRAFT→DIVIDING→CLOSING→LETTER. LETTER transition sets letter_at and makes article immutable."
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionArticleBody"
      responses:
        "200":
          description: Transitioned article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Inbox ────────────────────────────────────────
  /inbox:
    get:
      operationId: listInbox
      tags: [inbox]
      summary: List inbox items for a user
      description: Only returns items where visible_at <= now
      parameters:
        - name: recipientId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Inbox items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxItem"

  /inbox/{id}:
    get:
      operationId: getInboxItem
      tags: [inbox]
      summary: Get inbox item
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInboxItem
      tags: [inbox]
      summary: Delete inbox item
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inbox/{id}/open:
    post:
      operationId: markInboxOpened
      tags: [inbox]
      summary: Mark inbox item as opened (sets opened_at)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Updated inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /inbox/{id}/read:
    post:
      operationId: markInboxRead
      tags: [inbox]
      summary: Mark inbox item as read (完독)
      description: Sets is_read=true and creates UserArticleRead record
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Updated inbox item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── MyCollections ────────────────────────────────
  /my-collections:
    get:
      operationId: listMyCollections
      tags: [my-collections]
      summary: List personal collections for a user
      parameters:
        - name: ownerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyCollection"
    post:
      operationId: createMyCollection
      tags: [my-collections]
      summary: Create a personal collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMyCollectionBody"
      responses:
        "201":
          description: Created collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCollection"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /my-collections/{id}:
    get:
      operationId: getMyCollection
      tags: [my-collections]
      summary: Get personal collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCollection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMyCollection
      tags: [my-collections]
      summary: Update personal collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyCollectionBody"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCollection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMyCollection
      tags: [my-collections]
      summary: Delete personal collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /my-collections/{id}/articles:
    get:
      operationId: listMyCollectionArticles
      tags: [my-collections]
      summary: List articles in a personal collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Articles in collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyCollectionArticleWithDetails"
    post:
      operationId: addArticleToMyCollection
      tags: [my-collections]
      summary: Add article to personal collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddArticleBody"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCollectionArticle"
        "400":
          description: Duplicate or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /my-collections/{collectionId}/articles/{articleId}:
    delete:
      operationId: removeArticleFromMyCollection
      tags: [my-collections]
      summary: Remove article from personal collection
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: articleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── StoredSentences ──────────────────────────────
  /stored-sentences:
    get:
      operationId: listStoredSentences
      tags: [stored-sentences]
      summary: List stored sentences for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: favorite
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Sentences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoredSentence"
    post:
      operationId: createStoredSentence
      tags: [stored-sentences]
      summary: Store a sentence from an article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoredSentenceBody"
      responses:
        "201":
          description: Created sentence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSentence"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stored-sentences/{id}:
    get:
      operationId: getStoredSentence
      tags: [stored-sentences]
      summary: Get a stored sentence by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Sentence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSentence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStoredSentence
      tags: [stored-sentences]
      summary: Delete a stored sentence
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stored-sentences/{id}/favorite:
    patch:
      operationId: toggleStoredSentenceFavorite
      tags: [stored-sentences]
      summary: Toggle favorite status
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isFavorite:
                  type: boolean
              required:
                - isFavorite
      responses:
        "200":
          description: Updated sentence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSentence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Reading ──────────────────────────────────────
  /reading-records:
    get:
      operationId: getReadingRecord
      tags: [reading]
      summary: Get reading progress for a user+article
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: articleId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reading record (or null if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingRecordNullable"
    put:
      operationId: upsertReadingRecord
      tags: [reading]
      summary: Create or update reading progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertReadingRecordBody"
      responses:
        "200":
          description: Upserted reading record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reading-records/{id}:
    delete:
      operationId: deleteReadingRecord
      tags: [reading]
      summary: Delete a reading record
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user-article-reads:
    post:
      operationId: createUserArticleRead
      tags: [reading]
      summary: Record article completion (完독)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserArticleReadBody"
      responses:
        "201":
          description: Created read record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserArticleRead"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user-article-reads/{id}:
    get:
      operationId: getUserArticleRead
      tags: [reading]
      summary: Get a user article read record by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Read record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserArticleRead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUserArticleRead
      tags: [reading]
      summary: Delete a user article read record
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user-article-reads/check:
    get:
      operationId: checkArticleRead
      tags: [reading]
      summary: Check if user has completed reading an article
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: articleId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Read status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isRead:
                    type: boolean
                  completedAt:
                    type: string
                    format: date-time
                    nullable: true
                required:
                  - isRead

  # ─── TeamCollections ──────────────────────────────
  /team-collections:
    get:
      operationId: listTeamCollections
      tags: [team-collections]
      summary: List team collections for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Team collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamCollectionWithRole"
    post:
      operationId: createTeamCollection
      tags: [team-collections]
      summary: Create a team collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamCollectionBody"
      responses:
        "201":
          description: Created team collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCollection"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /team-collections/{id}:
    get:
      operationId: getTeamCollection
      tags: [team-collections]
      summary: Get team collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Team collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCollection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTeamCollection
      tags: [team-collections]
      summary: Update team collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamCollectionBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCollection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTeamCollection
      tags: [team-collections]
      summary: Delete team collection (OWNER only)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /team-collections/{id}/members:
    get:
      operationId: listTeamMembers
      tags: [team-collections]
      summary: List team collection members
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMemberWithUser"
    post:
      operationId: addTeamMember
      tags: [team-collections]
      summary: Add member to team collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTeamMemberBody"
      responses:
        "201":
          description: Added member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCollectionMembership"
        "400":
          description: Already a member or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /team-collections/{teamId}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [team-collections]
      summary: Remove member from team collection
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /team-collections/{id}/articles:
    get:
      operationId: listTeamArticles
      tags: [team-collections]
      summary: List articles in team collection
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: userId
          in: query
          required: false
          description: When provided, each item includes the requesting user's per-article read state (isRead/completedAt) so callers can decide reading mode (basic vs re_read) without an extra request.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamCollectionArticleWithDetails"
    post:
      operationId: addTeamArticle
      tags: [team-collections]
      summary: Add article to team collection (own articles only)
      description: |
        Adds an article to the team collection and fans it out to all OWNER/MEMBER inboxes
        (excluding the sender). When `asNotice=true`, the sender must be an OWNER and no
        other notice may already exist for the current KST notice date for this collection.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTeamArticleBody"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCollectionArticle"
        "400":
          description: Not own article, not OWNER (when asNotice=true), or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A notice already exists for this collection on the current notice date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /team-collections/{id}/today-greeting-status:
    get:
      operationId: getTodayGreetingStatus
      tags: [team-collections]
      summary: Today's "오늘의 인사" status for a (collection, user) pair
      description: |
        Returns whether the requesting user is an OWNER of the collection and whether a notice
        has already been sent for the current KST notice date window. Used by the send screen
        to decide if the "오늘의 인사" modal should be shown.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayGreetingStatus"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /team-collections/{teamId}/articles/{articleId}:
    delete:
      operationId: removeTeamArticle
      tags: [team-collections]
      summary: Remove article from team collection
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: articleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Neighbors ────────────────────────────────────
  /neighbors:
    get:
      operationId: listNeighbors
      tags: [neighbors]
      summary: List neighbors for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Neighbors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NeighborWithUser"

  /neighbors/{id}:
    get:
      operationId: getNeighbor
      tags: [neighbors]
      summary: Get neighbor by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Neighbor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Neighbor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: removeNeighbor
      tags: [neighbors]
      summary: Remove neighbor relationship
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /neighbor-requests:
    get:
      operationId: listNeighborRequests
      tags: [neighbors]
      summary: List pending neighbor requests for a user (by recipientId or requesterId)
      parameters:
        - name: recipientId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: requesterId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Neighbor requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NeighborRequestWithUser"
    post:
      operationId: createNeighborRequest
      tags: [neighbors]
      summary: Send a neighbor request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNeighborRequestBody"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborRequest"
        "400":
          description: Already neighbors or duplicate request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /neighbor-requests/{id}:
    get:
      operationId: getNeighborRequest
      tags: [neighbors]
      summary: Get neighbor request by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Neighbor request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteNeighborRequest
      tags: [neighbors]
      summary: Delete (cancel) a neighbor request
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /neighbor-requests/{id}/accept:
    post:
      operationId: acceptNeighborRequest
      tags: [neighbors]
      summary: Accept neighbor request (creates Neighbor, deletes request)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Created neighbor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Neighbor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /neighbor-requests/{id}/reject:
    post:
      operationId: rejectNeighborRequest
      tags: [neighbors]
      summary: Reject neighbor request (deletes request)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Rejected
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── SendRecords ──────────────────────────────────
  /send-records:
    get:
      operationId: listSendRecords
      tags: [send-records]
      summary: List send records for a user
      parameters:
        - name: senderId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Send records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SendRecordWithDetails"
    post:
      operationId: sendArticle
      tags: [send-records]
      summary: Send an article to a recipient
      description: "Creates SendRecord + Inbox entry. Auto-assigns 06:00 or 18:00 KST delivery slot. Article must be LETTER status."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendArticleBody"
      responses:
        "201":
          description: Send record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRecordWithDetails"
        "400":
          description: Article not LETTER or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /send-records/{id}:
    get:
      operationId: getSendRecord
      tags: [send-records]
      summary: Get send record by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Send record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRecordWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSendRecord
      tags: [send-records]
      summary: Delete send record
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── User ───────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        nickname:
          type: string
        avatarUrl:
          type: string
          nullable: true
        recentSavedCollectionId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, nickname, createdAt, updatedAt]

    CreateUserBody:
      type: object
      properties:
        email:
          type: string
          format: email
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        avatarUrl:
          type: string
          nullable: true
      required: [email, nickname]

    UpdateUserBody:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        avatarUrl:
          type: string
          nullable: true

    RecentSavedCollectionResponse:
      type: object
      properties:
        recentSavedCollectionId:
          type: string
          format: uuid
          nullable: true
      required: [recentSavedCollectionId]

    UpdateRecentCollectionBody:
      type: object
      properties:
        collectionId:
          type: string
          format: uuid
          nullable: true
      required: [collectionId]

    # ─── Article ────────────────────────────────────
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [DRAFT, DIVIDING, CLOSING, LETTER]
        pages:
          type: array
          items:
            type: string
          nullable: true
        layoutWidth:
          type: number
          nullable: true
          description: Container width used when splitting pages (px). Used to ensure consistent line-break rendering across preview and reader screens.
        style:
          type: object
          nullable: true
        cover:
          $ref: "#/components/schemas/ArticleCover"
          nullable: true
        letterAt:
          type: string
          format: date-time
          nullable: true
        sourceArticleId:
          type: string
          format: uuid
          nullable: true
        isNotice:
          type: boolean
          description: True when this article was sent as the day's "오늘의 인사" notice.
        noticeDate:
          type: string
          format: date
          nullable: true
          description: KST date this article was designated as a notice (YYYY-MM-DD). Null when isNotice=false.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, authorId, title, content, status, createdAt, updatedAt]

    CreateArticleBody:
      type: object
      properties:
        authorId:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
      required: [authorId, title]

    UpdateArticleBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        pages:
          type: array
          items:
            type: string
          nullable: true
        layoutWidth:
          type: number
          nullable: true
          description: Container width used when splitting pages (px).
        style:
          type: object
          nullable: true
        cover:
          $ref: "#/components/schemas/ArticleCover"
          nullable: true

    ArticleCover:
      type: object
      description: Article cover display settings. null means default cover.
      properties:
        type:
          type: string
          enum: [image, color, default]
        imageUrl:
          type: string
          format: uri
          description: Cover image URL (used when type=image)
        bgColor:
          type: string
          description: Background color hex (used when type=color)
        textColor:
          type: string
          description: Text color hex for title overlay
        align:
          type: string
          enum: [left, center]
      required: [type, textColor, align]

    TransitionArticleBody:
      type: object
      properties:
        targetStatus:
          type: string
          enum: [DRAFT, DIVIDING, CLOSING, LETTER]
      required: [targetStatus]

    # ─── Inbox ──────────────────────────────────────
    InboxItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        visibleAt:
          type: string
          format: date-time
        openedAt:
          type: string
          format: date-time
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        article:
          $ref: "#/components/schemas/Article"
        sender:
          $ref: "#/components/schemas/User"
        collectionName:
          type: string
          nullable: true
        isReplyToMe:
          type: boolean
        replyToArticleId:
          type: string
          format: uuid
          nullable: true
      required: [id, recipientId, articleId, senderId, visibleAt, isRead, createdAt, isReplyToMe]

    # ─── MyCollection ───────────────────────────────
    MyCollection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        isPublic:
          type: boolean
        isArchive:
          type: boolean
        coverImageUrl:
          type: string
          nullable: true
        articleCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, ownerId, name, isPublic, isArchive, createdAt, updatedAt]

    CreateMyCollectionBody:
      type: object
      properties:
        ownerId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          nullable: true
        isPublic:
          type: boolean
        coverImageUrl:
          type: string
          nullable: true
      required: [ownerId, name]

    UpdateMyCollectionBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          nullable: true
        isPublic:
          type: boolean
        coverImageUrl:
          type: string
          nullable: true

    MyCollectionArticle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        myCollectionId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        addedAt:
          type: string
          format: date-time
      required: [id, myCollectionId, articleId, addedAt]

    MyCollectionArticleWithDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        myCollectionId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        addedAt:
          type: string
          format: date-time
        article:
          $ref: "#/components/schemas/Article"
      required: [id, myCollectionId, articleId, addedAt]

    AddArticleBody:
      type: object
      properties:
        articleId:
          type: string
          format: uuid
      required: [articleId]

    # ─── StoredSentence ─────────────────────────────
    StoredSentence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        text:
          type: string
        position:
          type: object
          nullable: true
        isFavorite:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, userId, articleId, text, isFavorite, createdAt]

    CreateStoredSentenceBody:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
        position:
          type: object
          nullable: true
      required: [userId, articleId, text]

    # ─── Reading ────────────────────────────────────
    ReadingRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        currentPage:
          type: integer
        scrollPosition:
          type: number
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, articleId, currentPage, scrollPosition, updatedAt]

    ReadingRecordNullable:
      type: object
      properties:
        record:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ReadingRecord"
            - type: "null"
      required: [record]

    UpsertReadingRecordBody:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        currentPage:
          type: integer
          minimum: 0
        scrollPosition:
          type: number
          minimum: 0
          maximum: 1
      required: [userId, articleId, currentPage, scrollPosition]

    UserArticleRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        completedAt:
          type: string
          format: date-time
      required: [id, userId, articleId, completedAt]

    CreateUserArticleReadBody:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
      required: [userId, articleId]

    # ─── TeamCollection ─────────────────────────────
    TeamCollection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        creatorId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, creatorId, createdAt, updatedAt]

    TeamCollectionWithRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        creatorId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, MEMBER]
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, creatorId, role, createdAt, updatedAt]

    CreateTeamCollectionBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          nullable: true
        creatorId:
          type: string
          format: uuid
      required: [name, creatorId]

    UpdateTeamCollectionBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          nullable: true

    TeamCollectionMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamCollectionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, MEMBER]
        joinedAt:
          type: string
          format: date-time
      required: [id, teamCollectionId, userId, role, joinedAt]

    TeamMemberWithUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamCollectionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, MEMBER]
        joinedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
      required: [id, teamCollectionId, userId, role, joinedAt]

    TeamCollectionArticle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamCollectionId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        addedBy:
          type: string
          format: uuid
        addedAt:
          type: string
          format: date-time
      required: [id, teamCollectionId, articleId, addedBy, addedAt]

    TeamCollectionArticleWithDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamCollectionId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        addedBy:
          type: string
          format: uuid
        addedAt:
          type: string
          format: date-time
        article:
          $ref: "#/components/schemas/Article"
        isRead:
          type: boolean
          description: Whether the requesting user has ever completed this article. Only present when the listTeamArticles request includes userId.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp at which the requesting user first completed this article, or null if never. Only present when the listTeamArticles request includes userId.
      required: [id, teamCollectionId, articleId, addedBy, addedAt]

    AddTeamMemberBody:
      type: object
      properties:
        userId:
          type: string
          format: uuid
      required: [userId]

    AddTeamArticleBody:
      type: object
      properties:
        articleId:
          type: string
          format: uuid
        addedBy:
          type: string
          format: uuid
        asNotice:
          type: boolean
          description: When true, the addedBy user is the OWNER and this article is designated as today's "오늘의 인사" for this collection. The server validates ownership and one-per-day uniqueness.
      required: [articleId, addedBy]

    TodayGreetingStatus:
      type: object
      properties:
        isOwner:
          type: boolean
          description: Whether the requesting user is an OWNER of this team collection.
        alreadySentToday:
          type: boolean
          description: Whether an "오늘의 인사" has already been sent for this collection on the current notice date window.
        noticeDate:
          type: string
          format: date
          description: The KST notice date (YYYY-MM-DD) the next greeting would be assigned to. Today before 18:00 KST, tomorrow after.
      required: [isOwner, alreadySentToday, noticeDate]

