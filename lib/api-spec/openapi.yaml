          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Neighbor requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NeighborRequestWithUser"
    post:
      operationId: createNeighborRequest
      tags: [neighbors]
      summary: Send a neighbor request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNeighborRequestBody"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborRequest"
        "400":
          description: Already neighbors or duplicate request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /neighbor-requests/{id}:
    get:
      operationId: getNeighborRequest
      tags: [neighbors]
      summary: Get neighbor request by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Neighbor request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborRequest"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteNeighborRequest
      tags: [neighbors]
      summary: Delete (cancel) a neighbor request
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /neighbor-requests/{id}/accept:
    post:
      operationId: acceptNeighborRequest
      tags: [neighbors]
      summary: Accept neighbor request (creates Neighbor, deletes request)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Created neighbor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Neighbor"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /neighbor-requests/{id}/reject:
    post:
      operationId: rejectNeighborRequest
      tags: [neighbors]
      summary: Reject neighbor request (deletes request)
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Rejected
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── SendRecords ──────────────────────────────────
  /send-records:
    get:
      operationId: listSendRecords
      tags: [send-records]
      summary: List send records for a user
      parameters:
        - name: senderId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Send records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SendRecordWithDetails"
    post:
      operationId: sendArticle
      tags: [send-records]
      summary: Send an article to a recipient
      description: "Creates SendRecord + Inbox entry. Auto-assigns 06:00 KST delivery slot (single daily slot). Article must be LETTER status."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendArticleBody"
      responses:
        "201":
          description: Send record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRecordWithDetails"
        "400":
          description: Article not LETTER or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /send-records/{id}:
    get:
      operationId: getSendRecord
      tags: [send-records]
      summary: Get send record by ID
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Send record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendRecordWithDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSendRecord
      tags: [send-records]
      summary: Delete send record
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Thoughts ──────────────────────────────────────
  /thoughts:
    get:
      operationId: listThoughts
      tags: [thoughts]
      summary: List thoughts for the authenticated user
      description: Returns thoughts belonging to the authenticated user. No query params — identity is taken from the auth token.
      responses:
        "200":
          description: Thought list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Thought"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createThought
      tags: [thoughts]
      summary: Create a thought (단상)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThoughtBody"
      responses:
        "201":
          description: Created thought
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thought"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── User ───────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        nickname:
          type: string
        avatarUrl:
          type: string
          nullable: true
        recentSavedCollectionId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, nickname, createdAt, updatedAt]

    CreateUserBody:
      type: object
      properties:
        email:
          type: string
          format: email
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        avatarUrl:
          type: string
          nullable: true
      required: [email, nickname]

    UpdateUserBody:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        avatarUrl:
          type: string
          nullable: true

    RecentSavedCollectionResponse:
      type: object
      properties:
        recentSavedCollectionId:
          type: string
          format: uuid
          nullable: true
      required: [recentSavedCollectionId]

    UpdateRecentCollectionBody:
      type: object
      properties:
        collectionId:
          type: string
          format: uuid
          nullable: true
      required: [collectionId]

    # ─── Article ────────────────────────────────────
    Article:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        authorNickname:
          type: string
          nullable: true
          description: Author's nickname. Populated by listArticles when joining users; may be null on other endpoints.
        collectionName:
          type: string
          nullable: true
          description: Name of the collection this article belongs to (team collection preferred, personal collection fallback). Populated by getArticle; may be null on other endpoints.
        collectionId:
          type: string
          format: uuid
          nullable: true
          description: ID of the team collection this article was delivered through, used for navigation to the collection detail. Null for personal-only or 1:1 articles. Populated by getArticle; may be null on other endpoints.
        title:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [DRAFT, DIVIDING, CLOSING, LETTER]
        pages:
          type: array
          items:
            type: string
          nullable: true
        layoutWidth:
          type: number
          nullable: true
          description: Container width used when splitting pages (px). Used to ensure consistent line-break rendering across preview and reader screens.
        style:
          type: object
          nullable: true
        cover:
          $ref: "#/components/schemas/ArticleCover"
          nullable: true
        letterAt:
          type: string
          format: date-time
          nullable: true
        sourceArticleId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, authorId, title, content, status, createdAt, updatedAt]

    CreateArticleBody:
      type: object
      properties:
        authorId:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        sourceArticleId:
          type: string
          format: uuid
          description: Optional ID of the source article this draft is a reply/memo to.
      required: [authorId, title]

    UpdateArticleBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        pages:
          type: array
          items:
            type: string
          nullable: true
        layoutWidth:
          type: number
          nullable: true
          description: Container width used when splitting pages (px).
        style:
          type: object
          nullable: true
        cover:
          $ref: "#/components/schemas/ArticleCover"
          nullable: true
        sourceArticleId:
          type: string
          format: uuid
          nullable: true
          description: ID of the source article this draft is a reply to. Set to null to unlink.

    ArticleCover:
      type: object
      description: Article cover display settings. null means default cover.
      properties:
        type:
          type: string
          enum: [image, color, default]
        imageUrl:
          type: string
          format: uri
          description: Cover image URL (used when type=image)
        bgColor:
          type: string
          description: Background color hex (used when type=color)
        textColor:
          type: string
          description: Text color hex for title overlay
        align:
          type: string
          enum: [left, center]
      required: [type, textColor, align]

    TransitionArticleBody:
      type: object
      properties:
        targetStatus:
          type: string
          enum: [DRAFT, DIVIDING, CLOSING, LETTER]
      required: [targetStatus]

    FinalizeArticleBody:
      type: object
      properties:
        myCollectionId:
          type: string
          format: uuid
          description: Optional personal collection to add the finalized article to. When omitted, the article is finalized without being added to a collection.

    ArticleQuestionsResponse:
      type: object
      properties:
        questions:
          type: array
          items:
            type: string
          description: Ordered list of question card questions. 5 AI-generated questions when available, otherwise the 3 fixed fallback questions.
      required: [questions]

    # ─── Inbox ──────────────────────────────────────
    InboxItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        sourceTeamCollectionId:
          type: string
          format: uuid
          nullable: true
          description: Team collection through which this inbox row was delivered. NULL for 1:1 / neighbor sends.
        visibleAt:
          type: string
          format: date-time
        openedAt:
          type: string
          format: date-time
          nullable: true
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        article:
          $ref: "#/components/schemas/Article"
        sender:
          $ref: "#/components/schemas/User"
        collectionName:
          type: string
          nullable: true
        isReplyToMe:
          type: boolean
        replyToArticleId:
          type: string
          format: uuid
          nullable: true
        hasReadBefore:
          type: boolean
        hasReadSourceArticle:
          type: boolean
          nullable: true
          description: Whether the recipient has previously completed reading the source (parent) article. NULL when this item is not a reply (replyToArticleId is null).
        isEnvelope:
          type: boolean
          description: Whether this inbox item was sent as a sealed envelope. When true and openedAt is null, the recipient sees the envelope front face first.
      required: [id, recipientId, articleId, senderId, visibleAt, isRead, createdAt, isReplyToMe, hasReadBefore, isEnvelope]

    MarkInboxOthersReadResponse:
      type: object
      properties:
        updatedCount:
          type: integer
      required: [updatedCount]

    # ─── MyCollection ───────────────────────────────
    MyCollection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        isPublic:
          type: boolean
        isArchive:
          type: boolean
        isImpression:
          type: boolean
        coverImageUrl:
          type: string
          nullable: true
        articleCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, ownerId, name, isPublic, isArchive, isImpression, createdAt, updatedAt]

    CreateMyCollectionBody:
      type: object
      properties:
        ownerId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          nullable: true
        isPublic:
          type: boolean
        isImpression:
          type: boolean
        coverImageUrl:
          type: string
          nullable: true
      required: [ownerId, name]

    UpdateMyCollectionBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          nullable: true
        isPublic:
          type: boolean
        coverImageUrl:
          type: string
          nullable: true

    MyCollectionArticle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        myCollectionId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        addedAt:
          type: string
          format: date-time
      required: [id, myCollectionId, articleId, addedAt]

    MyCollectionArticleWithDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        myCollectionId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        addedAt:
          type: string
          format: date-time
        article:
          $ref: "#/components/schemas/Article"
      required: [id, myCollectionId, articleId, addedAt]

    AddArticleBody:
      type: object
      properties:
        articleId:
          type: string
          format: uuid
      required: [articleId]

    # ─── StoredSentence ─────────────────────────────
    StoredSentence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        text:
          type: string
        position:
          type: object
          nullable: true
        isFavorite:
          type: boolean
        favoritedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the sentence was last marked as favorite. Null if not favorited.
        createdAt:
          type: string
          format: date-time
        articleTitle:
          type: string
          nullable: true
          description: Title of the source article (joined from articles table). May be null if the article is missing.
      required: [id, userId, articleId, text, isFavorite, favoritedAt, createdAt, articleTitle]

    CreateStoredSentenceBody:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
        position:
          type: object
          nullable: true
      required: [userId, articleId, text]

    # ─── Reading ────────────────────────────────────
    ReadingRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        currentPage:
          type: integer
        scrollPosition:
          type: number
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, articleId, currentPage, scrollPosition, updatedAt]

    ReadingRecordNullable:
      type: object
      properties:
        record:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ReadingRecord"
            - type: "null"
      required: [record]

    UpsertReadingRecordBody:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        currentPage:
          type: integer
          minimum: 0
        scrollPosition:
          type: number
          minimum: 0
          maximum: 1
      required: [userId, articleId, currentPage, scrollPosition]

    UserArticleRead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        completedAt:
          type: string
          format: date-time
      required: [id, userId, articleId, completedAt]

    CreateUserArticleReadBody:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
      required: [userId, articleId]

    # ─── TeamCollection ─────────────────────────────
    TeamCollection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        creatorId:
          type: string
          format: uuid
        creatorNickname:
          type: string
          nullable: true
          description: Nickname of the collection creator (joined from users table). May be null if user is missing.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, creatorId, createdAt, updatedAt]

    TeamCollectionWithRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        creatorId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, MEMBER]
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, creatorId, role, createdAt, updatedAt]

    CreateTeamCollectionBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          nullable: true
        creatorId:
          type: string
          format: uuid
      required: [name, creatorId]

    UpdateTeamCollectionBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          nullable: true

    TeamCollectionMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamCollectionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, MEMBER]
        joinedAt:
          type: string
          format: date-time
      required: [id, teamCollectionId, userId, role, joinedAt]

    TeamMemberWithUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamCollectionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, MEMBER]
        joinedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
      required: [id, teamCollectionId, userId, role, joinedAt]

    TeamCollectionArticle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamCollectionId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        addedBy:
          type: string
          format: uuid
        addedAt:
          type: string
          format: date-time
        isPinned:
          type: boolean
          description: Whether this article has been pinned by the collection owner.
      required: [id, teamCollectionId, articleId, addedBy, addedAt, isPinned]

    TeamCollectionArticleWithDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamCollectionId:
          type: string
          format: uuid
        articleId:
          type: string
          format: uuid
        addedBy:
          type: string
          format: uuid
        addedAt:
          type: string
          format: date-time
        article:
          $ref: "#/components/schemas/Article"
        isRead:
          type: boolean
          description: Whether the requesting user has ever completed this article. Only present when the listTeamArticles request includes userId.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp at which the requesting user first completed this article, or null if never. Only present when the listTeamArticles request includes userId.
        sourceArticleId:
          type: string
          format: uuid
          nullable: true
          description: Shortcut to article.sourceArticleId for threading. Null when the article has no source.
        parentInThisCollection:
          type: boolean
          description: True when the sourceArticleId belongs to another article already in this collection (used for reply threading).
        isDeletedPlaceholder:
          type: boolean
          description: True when the underlying article has been soft-deleted. The row remains so reply threads stay intact.
        visibleAt:
          type: string
          format: date-time
          nullable: true
          description: The inbox visibleAt of the requesting user for this article. Null when no requester userId is provided or when there is no inbox row.
        isPinned:
          type: boolean
          description: Whether this article has been pinned by the collection owner.
      required: [id, teamCollectionId, articleId, addedBy, addedAt, isPinned]

    ToggleTeamArticlePinBody:
      type: object
      properties:
        isPinned:
          type: boolean
        requesterId:
          type: string
          format: uuid
          description: The user making the request. Must be the collection OWNER.
      required: [isPinned, requesterId]

    AddTeamMemberBody:
      type: object
      properties:
        userId:
          type: string
          format: uuid
      required: [userId]

    AddTeamArticleBody:
      type: object
      properties:
        articleId:
          type: string
          format: uuid
        addedBy:
          type: string
          format: uuid
      required: [articleId, addedBy]

    # ─── Neighbor ───────────────────────────────────
    Neighbor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userAId:
          type: string
          format: uuid
        userBId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
      required: [id, userAId, userBId, createdAt, acceptedAt]

    NeighborWithUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        neighborUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
      required: [id, neighborUserId, createdAt, acceptedAt]

    NeighborRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requesterId:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING]
        createdAt:
          type: string
          format: date-time
      required: [id, requesterId, recipientId, status, createdAt]

    NeighborRequestWithUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requesterId:
          type: string
          format: uuid
        recipientId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING]
        createdAt:
          type: string
          format: date-time
        requester:
          $ref: "#/components/schemas/User"
        recipient:
